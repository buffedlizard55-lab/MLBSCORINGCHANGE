# Every deterministic test suite on every push / pull request (no network).
# The live-API smoke test runs separately and never blocks: it depends on the
# day's schedule and on MLB's servers.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Deterministic test suites
        run: |
          set -e
          for t in tools/*-test.mjs tools/pipeline-offline-smoke.mjs; do
            case "$t" in tools/smoke-test.mjs) continue ;; esac
            echo "::group::$t"
            node "$t"
            echo "::endgroup::"
          done

  live-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Live MLB StatsAPI smoke test (informational)
        run: node tools/smoke-test.mjs
