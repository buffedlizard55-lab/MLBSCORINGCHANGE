name: probe
on:
  push:
    branches: ['arena/01a0d490-mlbscoringchange']
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          a=$(curl -s -o /dev/null -w "%{http_code}" https://statsapi.mlb.com/api/v1/eventTypes)
          b=$(curl -s -o /tmp/sc.html -w "%{http_code}" -A "Mozilla/5.0" https://www.mlb.com/official-information/scoring-changes)
          c=$(curl -s -o /tmp/sv.csv -w "%{http_code}" -A "Mozilla/5.0" "https://baseballsavant.mlb.com/statcast_search/csv?all=true&hfAB=field%5C.%5C.error%7C&hfSea=2026%7C&player_type=batter&type=details")
          echo "::notice title=probe::statsapi=$a mlbcom=$b bytes=$(wc -c </tmp/sc.html) savant=$c bytes=$(wc -c </tmp/sv.csv) lines=$(wc -l </tmp/sv.csv) first=$(head -c 300 /tmp/sv.csv | tr -d '\n\r' | tr ',' ';')"
